# Dashboard provisioning configuration
apiVersion: 1

providers:
  - name: 'ObsStack Dashboards'
    orgId: 1
    folder: 'ObsStack'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true